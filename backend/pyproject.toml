[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sift-ai-backend"
version = "0.1.0"
description = "FastAPI backend for SIFT.AI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi[standard]>=0.111.0",
  "ahnlich-client-py>=0.1.0",
  "grpclib>=0.4.0",
  "pymupdf>=1.24.0",
  "langchain-text-splitters>=0.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
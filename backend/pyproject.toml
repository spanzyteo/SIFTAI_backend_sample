[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sift-ai-backend"
version = "0.1.0"
description = "FastAPI backend for SIFT.AI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi[standard]>=0.111.0",
  "ahnlich-client-py>=0.3.0",
  "grpclib>=0.4.0",
  "pymupdf>=1.24.0",
  "langchain-text-splitters>=0.2.0",
  "sqlalchemy[asyncio]>=2.0.0",
  "asyncpg>=0.29.0",
  "psycopg[binary]>=3.1.0",
  "redis>=5.0.0",
  "faster-whisper>=1.0.0",
  "pyjwt[crypto]>=2.8.0",
  "exa-py>=2.14.0",
  "langchain-google-genai>=1.0.0",
  "langchain-core>=0.2.0",
  "sse-starlette>=2.0.0",
  "boto3>=1.26.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
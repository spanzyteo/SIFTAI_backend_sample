services:
  api:
    build:
      context: .
      network: host
    ports:
      - "8000:8000"
    environment:
      AHNLICH_HOST: ahnlich
      AHNLICH_PORT: 1370
      USE_AHNLICH: "true"
      AHNLICH_STORE_NAME: "legal_docs"
      # Document registry (GET/DELETE /documents). Point this at your Neon
      # (or any Postgres) database. Falls back to an in-memory registry
      # (lost on restart) if unset - fine for a quick local smoke test.
      DATABASE_URL: ${DATABASE_URL:-}
      # Search result cache (optional). Falls back to a no-op cache if unset.
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
    command: fastapi dev --entrypoint app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - ahnlich
      - redis

  ahnlich_db:
    image: ghcr.io/deven96/ahnlich-db:latest
    entrypoint: ["ahnlich-db"]
    command: ["run", "--host", "0.0.0.0", "--port", "1369"]
    ports:
      - "1369:1369"

  ahnlich:
    image: ghcr.io/deven96/ahnlich-ai:latest
    entrypoint: ["ahnlich-ai"]
    command:
      [
        "run",
        "--host",
        "0.0.0.0",
        "--port",
        "1370",
        "--db-host",
        "ahnlich_db",
        "--db-port",
        "1369",
      ]
    ports:
      - "1370:1370"
    depends_on:
      - ahnlich_db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
